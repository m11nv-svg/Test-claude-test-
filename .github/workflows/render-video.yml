name: Render Video

on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      job_json:
        description: "JSON job payload"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: render-video-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core
          python -m pip install --upgrade pip
          pip install -r render/requirements.txt

      - name: Write job payload safely
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_INPUT: ${{ github.event.inputs.job_json }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              raw = os.environ.get("MANUAL_INPUT", "")
              job = json.loads(raw)
          else:
              raw = os.environ.get("DISPATCH_PAYLOAD", "")
              job = json.loads(raw)

          if not isinstance(job, dict):
              raise SystemExit("Job payload must be a JSON object")

          Path("job.json").write_text(
              json.dumps(job, ensure_ascii=False),
              encoding="utf-8"
          )
          print("Job payload received and saved.")
          PY

      - name: Render video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python render/render.py job.json out/final.mp4

      - name: Verify MP4 output
        run: |
          test -s out/final.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of json out/final.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of json out/final.mp4

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/final.mp4
          retention-days: 3

      - name: Send video to Telegram through Make
        env:
          MAKE_VIDEO_WEBHOOK_URL: ${{ secrets.MAKE_VIDEO_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests

          webhook_url = os.environ.get("MAKE_VIDEO_WEBHOOK_URL", "").strip()
          if not webhook_url:
              raise SystemExit("Missing GitHub Actions secret MAKE_VIDEO_WEBHOOK_URL")

          with open("job.json", encoding="utf-8") as job_file:
              job = json.load(job_file)

          with open("out/final.mp4", "rb") as video_file:
              response = requests.post(
                  webhook_url,
                  data={
                      "chat_id": str(job["chat_id"]),
                      "caption": job.get("title", "الفيديو جاهز للمراجعة"),
                  },
                  files={"video": ("final.mp4", video_file, "video/mp4")},
                  timeout=300,
              )

          print(f"Make video-delivery webhook: HTTP {response.status_code}")
          print(response.text[:1000])
          response.raise_for_status()
          PY
